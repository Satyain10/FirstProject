<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Again</title>
  <meta name="description" content="A clean sign-in page with a winter mountain landscape illustration.">
  <meta property="og:title" content="Hello Again">
  <meta property="og:description" content="A clean sign-in page with a winter mountain landscape illustration.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #202020;
      --muted: #b0b0b0;
      --line: #e8e8e8;
      --accent: #986c78;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 48%, rgba(255,255,255,.08), transparent 32%),
        linear-gradient(135deg, #9eaaa8 0%, #beb4b4 48%, #17182d 100%);
    }

    .card {
      width: min(1080px, calc(100vw - 48px));
      min-height: 620px;
      display: grid;
      grid-template-columns: 42.5% 57.5%;
      padding: 12px;
      border-radius: 32px;
      background: #fff;
      box-shadow: 0 28px 65px rgba(25, 27, 43, .28);
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 68px 48px 32px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 45px 0 22px;
      color: #777;
      font-size: 12px;
      font-weight: 500;
    }

    form {
      width: min(290px, 100%);
      display: flex;
      flex-direction: column;
    }

    .field {
      position: relative;
      display: block;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 14px;
      background: #fff;
      color: #333;
      font: 400 12px Inter, sans-serif;
      outline: none;
    }

    input::placeholder { color: #bababa; }

    input:focus {
      border-color: #c29aa5;
      box-shadow: 0 0 0 3px rgba(152,108,120,.08);
    }

    .password input { padding-right: 42px; }

    .eye {
      position: absolute;
      right: 10px;
      top: 50%;
      width: 28px;
      height: 28px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      padding: 0;
    }

    .recovery {
      align-self: flex-end;
      margin: 1px 0 16px;
      color: #b7b7b7;
      font-size: 9px;
      text-decoration: none;
    }

    .signin {
      height: 44px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      font: 500 12px Inter, sans-serif;
      cursor: pointer;
    }

    .signin:hover { background: #87616c; }

    .message {
      min-height: 16px;
      margin: 7px 0 0;
      color: var(--accent);
      font-size: 10px;
      text-align: center;
    }

    .divider {
      width: min(290px, 100%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      margin: 20px 0 16px;
      color: #b7b7b7;
      font-size: 9px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #ededed;
    }

    .socials {
      display: flex;
      gap: 12px;
    }

    .social {
      width: 68px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid #efefef;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(0,0,0,.025);
    }

    .social:hover { transform: translateY(-1px); }

    .art {
      position: relative;
      min-height: 596px;
      overflow: hidden;
      border-radius: 20px;
      background: linear-gradient(180deg, #edb4b8 0%, #ffc5a4 20%, #f1ddd4 34%, #aaaacb 58%, #38436e 100%);
    }

    .sun {
      position: absolute;
      left: 11%;
      top: 12%;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: rgba(255, 242, 217, .95);
      box-shadow:
        0 0 32px 16px rgba(255, 231, 196, .45),
        0 0 70px 30px rgba(255, 232, 193, .18);
    }

    .birds,
    .bird {
      position: absolute;
      z-index: 5;
    }

    .birds {
      right: 40px;
      top: 35px;
      width: 130px;
      height: 120px;
      opacity: .9;
    }

    .bird { width: 28px; height: 16px; }
    .bird::before,
    .bird::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 7px;
      border-top: 2px solid #27304a;
      border-radius: 50%;
    }
    .bird::before { left: 1px; transform: rotate(-28deg); }
    .bird::after { right: 1px; transform: rotate(28deg); }

    .bird:nth-child(1) { left: 62px; top: 12px; transform: scale(.8); }
    .bird:nth-child(2) { left: 82px; top: 32px; transform: scale(.55); }
    .bird:nth-child(3) { left: 42px; top: 42px; transform: scale(.65); }

    .land {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 74%;
    }

    .caption {
      position: absolute;
      left: 28px;
      bottom: 42px;
      z-index: 8;
      max-width: 190px;
      margin: 0;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      text-shadow: 0 2px 12px rgba(34,35,70,.25);
    }

    .dots {
      position: absolute;
      left: 28px;
      bottom: 20px;
      z-index: 8;
      display: flex;
      gap: 6px;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
    }

    .dots .active { background: #fff; }

    @media (max-width: 820px) {
      body { padding: 16px; }
      .card {
        width: min(430px, calc(100vw - 32px));
        min-height: auto;
        grid-template-columns: 1fr;
      }
      .form-panel { min-height: 520px; padding: 55px 24px 28px; }
      .art { min-height: 280px; margin-top: 4px; }
      .subtitle { margin-top: 36px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="form-panel">
      <h1>Hello Again!</h1>
      <p class="subtitle">Let's get started with your 30 days trial</p>

      <form id="login-form">
        <label class="field">
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Email</span>
          <input id="email" type="email" placeholder="Email" autocomplete="email" required>
        </label>

        <label class="field password">
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</span>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button class="eye" type="button" id="toggle-password" aria-label="Show password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="2.8"/>
            </svg>
          </button>
        </label>

        <a class="recovery" href="#recovery">Recovery Password</a>
        <button class="signin" type="submit">Sign in</button>
        <p class="message" id="message" role="status"></p>
      </form>

      <div class="divider">Or continue with</div>

      <div class="socials">
        <button class="social" type="button" aria-label="Continue with Google">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4A20 20 0 1 0 24 44c11 0 20-8.9 20-20 0-1.2-.1-2.3-.4-3.5Z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4A20 20 0 0 0 6.3 14.7Z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5A20 20 0 0 0 24 44Z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.3 5.3C37.4 38.3 44 33 44 24c0-1.2-.1-2.3-.4-3.5Z"/>
          </svg>
        </button>

        <button class="social" type="button" aria-label="Continue with Apple">
          <svg width="18" height="20" viewBox="0 0 14 17" fill="#111">
            <path d="M11.4 8.9c0-2.2 1.8-3.2 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.3.8s-1.7-.8-2.9-.8c-1.5 0-2.8.9-3.6 2.2-1.5 2.7-.4 6.6 1.1 8.8.7 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.8-.7s1.7.7 2.9.7 1.9-1.1 2.6-2.1c.8-1.2 1.1-2.3 1.2-2.4-.1 0-2.2-.8-2.2-3.7ZM9.5 2.7c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.6.6-1.1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2Z"/>
          </svg>
        </button>

        <button class="social" type="button" aria-label="Continue with Facebook">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#1877F2"/>
            <path fill="#fff" d="M13.4 18.5v-5.1h1.7l.3-2h-2V10.1c0-.6.2-1 .9-1h1.1V7.2c-.2 0-.9-.1-1.7-.1-1.7 0-2.8 1-2.8 2.9v1.4H9.2v2h1.7v5.1h2.5Z"/>
          </svg>
        </button>
      </div>
    </section>

    <aside class="art" aria-label="Winter landscape illustration">
      <div class="sun"></div>
      <div class="birds" aria-hidden="true">
        <i class="bird"></i><i class="bird"></i><i class="bird"></i>
      </div>

      <svg class="land" viewBox="0 0 600 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#faf6ff"/>
            <stop offset="1" stop-color="#cbd0ed"/>
          </linearGradient>
          <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3d4a79"/>
            <stop offset="1" stop-color="#253153"/>
          </linearGradient>
        </defs>

        <path d="M0 170 C90 130 155 190 225 145 C310 94 390 155 600 90 V500 H0Z" fill="#9d9fb9" opacity=".48"/>
        <path d="M0 218 C105 178 176 235 280 172 C392 104 477 160 600 118 V500 H0Z" fill="#e6d8ef" opacity=".65"/>
        <path d="M0 268 C80 240 170 270 238 232 C332 180 440 216 600 162 V500 H0Z" fill="url(#snow)"/>
        <path d="M305 220 C374 145 446 178 510 118 C545 85 572 100 600 70 V500 H250 C265 408 285 300 305 220Z" fill="#7d86ad"/>
        <path d="M330 230 C405 150 466 190 520 130 L600 75 V500 H300 C304 390 316 300 330 230Z" fill="url(#mountain)"/>
        <path d="M350 214 C420 164 462 190 510 136 L600 85 V175 C532 212 442 246 350 214Z" fill="#dfe2f3" opacity=".88"/>

        <path d="M0 380 C115 328 222 380 320 330 C420 278 510 318 600 260 V500 H0Z" fill="#53648e" opacity=".62"/>
        <path d="M0 410 C150 372 250 420 370 350 C470 292 540 330 600 302 V500 H0Z" fill="#33405f"/>

        <g fill="#252f49">
          <g transform="translate(62 335)"><rect x="12" y="25" width="5" height="64"/><path d="M14 0 1 48h26Z"/><path d="M14 20 0 72h28Z"/></g>
          <g transform="translate(145 330) scale(.75)"><rect x="12" y="25" width="5" height="64"/><path d="M14 0 1 48h26Z"/><path d="M14 20 0 72h28Z"/></g>
          <g transform="translate(210 300) scale(1.05)"><rect x="12" y="25" width="5" height="64"/><path d="M14 0 1 48h26Z"/><path d="M14 20 0 72h28Z"/></g>
          <g transform="translate(315 300) scale(.8)"><rect x="12" y="25" width="5" height="64"/><path d="M14 0 1 48h26Z"/><path d="M14 20 0 72h28Z"/></g>
          <g transform="translate(390 270) scale(1.15)"><rect x="12" y="25" width="5" height="64"/><path d="M14 0 1 48h26Z"/><path d="M14 20 0 72h28Z"/></g>
        </g>

        <g fill="#12182d">
          <g transform="translate(0 390)"><path d="M0 20c40-24 82-20 120-2l-18 20H0Z"/><rect x="8" y="38" width="5" height="72"/></g>
          <g transform="translate(118 345)"><path d="M0 20c40-24 82-20 120-2l-18 20H0Z"/></g>
        </g>
      </svg>

      <p class="caption">Finally a login page that doesn't suck</p>
      <div class="dots"><span class="active"></span><span></span><span></span></div>
    </aside>
  </main>

  <script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("toggle-password");
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    toggle.addEventListener("click", () => {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      toggle.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      message.textContent = "Signed in as " + document.getElementById("email").value;
    });

    document.querySelectorAll(".social").forEach(button => {
      button.addEventListener("click", () => {
        message.textContent = button.getAttribute("aria-label");
      });
    });
  </script>
</body>
</html>
