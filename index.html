<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Again</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: Inter, "Segoe UI", sans-serif;
      background: #c9a89c;
      color: #1c1c1c;
    }

    .card {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 24px 50px rgba(90, 50, 40, 0.18);
      overflow: hidden;
    }

    .form-panel {
      padding: 56px 48px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .subtitle {
      margin-top: 28px;
      margin-bottom: 22px;
      font-size: 13px;
      color: #b5b5b5;
      text-align: center;
    }

    form {
      width: min(280px, 100%);
      display: flex;
      flex-direction: column;
    }

    .field {
      position: relative;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #ececec;
      border-radius: 8px;
      background: #fff;
      font: inherit;
      font-size: 13px;
      color: #333;
      outline: none;
    }

    input::placeholder { color: #c5c5c5; }

    input:focus {
      border-color: #c9a8b0;
    }

    .field.password input { padding-right: 40px; }

    .eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #bdbdbd;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 4px;
    }

    .recovery {
      align-self: flex-end;
      margin: 2px 0 18px;
      font-size: 11px;
      color: #b0b0b0;
      text-decoration: none;
    }

    .recovery:hover { color: #8a6a72; }

    .signin {
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: #8d6b74;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .signin:hover { background: #7d5d66; }

    .message {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #8d6b74;
    }

    .divider {
      width: min(280px, 100%);
      margin: 22px 0 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      color: #c8c8c8;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #ececec;
    }

    .socials {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .social {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .social.apple {
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      border: 1px solid #f2f2f2;
    }

    .social:hover { transform: translateY(-1px); }

    .art {
      margin: 16px 16px 16px 0;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      min-height: 460px;
      background: linear-gradient(180deg, #f7c7a2 0%, #f3b48c 18%, #eea3a4 46%, #c58eb4 70%, #7b68a4 100%);
    }

    .sky, .hills, .ground {
      position: absolute;
      inset: 0;
    }

    .sun {
      position: absolute;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      left: 22%;
      top: 16%;
      background: radial-gradient(circle, #fff8e4 0%, #ffe3a4 42%, rgba(255, 210, 140, 0.15) 68%, rgba(255, 210, 140, 0) 72%);
    }

    .caption {
      position: absolute;
      left: 28px;
      bottom: 52px;
      max-width: 180px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      text-shadow: 0 1px 8px rgba(60, 30, 70, 0.25);
    }

    .dots {
      position: absolute;
      left: 28px;
      bottom: 26px;
      display: flex;
      gap: 6px;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
    }

    .dots span.active { background: #fff; }

    @media (max-width: 760px) {
      .card { grid-template-columns: 1fr; }
      .form-panel { padding: 40px 24px 28px; }
      .art { margin: 0 16px 16px; min-height: 280px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="form-panel">
      <h1>Hello Again!</h1>
      <p class="subtitle">Let's get started with your 30 days trial</p>

      <form id="login-form">
        <label class="field">
          <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Email</span>
          <input id="email" type="email" name="email" placeholder="Email" autocomplete="email" required>
        </label>

        <label class="field password">
          <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Password</span>
          <input id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
          <button class="eye" type="button" id="toggle-password" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </label>

        <a class="recovery" href="#recovery">Recovery Password</a>
        <button class="signin" type="submit">Sign in</button>
        <p class="message" id="message" role="status"></p>
      </form>

      <div class="divider">Or continue with</div>

      <div class="socials">
        <button class="social" type="button" aria-label="Continue with Google">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.7 7.1l6.3 5.3C37.4 38.3 44 33 44 24c0-1.2-.1-2.3-.4-3.5z"/>
          </svg>
        </button>
        <button class="social apple" type="button" aria-label="Continue with Apple">
          <svg width="16" height="18" viewBox="0 0 14 17" fill="#111">
            <path d="M11.4 8.9c0-2.2 1.8-3.2 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.3.8s-1.7-.8-2.9-.8c-1.5 0-2.8.9-3.6 2.2-1.5 2.7-.4 6.6 1.1 8.8.7 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.8-.7s1.7.7 2.9.7 1.9-1.1 2.6-2.1c.8-1.2 1.1-2.3 1.2-2.4-.1 0-2.2-.8-2.2-3.7zM9.5 2.7c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.6.6-1.1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2z"/>
          </svg>
        </button>
        <button class="social" type="button" aria-label="Continue with Facebook">
          <svg width="22" height="22" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#1877F2"/>
            <path fill="#fff" d="M13.4 18.5v-5.1h1.7l.3-2h-2V10.1c0-.6.2-1 .9-1h1.1V7.2c-.2 0-.9-.1-1.7-.1-1.7 0-2.8 1-2.8 2.9v1.4H9.2v2h1.7v5.1h2.5z"/>
          </svg>
        </button>
      </div>
    </section>

    <aside class="art" aria-hidden="true">
      <div class="sun"></div>
      <svg class="hills" viewBox="0 0 420 520" preserveAspectRatio="xMidYMid slice">
        <path d="M0 230 C70 200 120 250 190 220 C250 196 300 188 420 210 V520 H0 Z" fill="#d9c4e4" opacity="0.45"/>
        <path d="M0 300 C90 250 130 330 210 286 C270 254 330 268 420 240 V520 H0 Z" fill="#f4eef8"/>
        <path d="M248 230 C300 168 348 196 390 132 C420 88 450 150 450 150 V540 H210 C214 420 230 300 248 230 Z" fill="#5b4c84"/>
        <path d="M318 168 C352 142 386 156 418 124 L446 156 C400 196 360 186 318 214 Z" fill="#f7f3fb"/>
        <g fill="#2a2144">
          <path d="M348 156 c6 -16 4 -16 -2 -2 c8 -12 16 -6 6 6 c8 -8 14 0 4 8 c-4 4 -10 2 -8 -12 z"/>
          <path d="M378 142 c5 -14 3 -12 -1 0 c6 -10 12 -4 4 6 c6 -6 10 0 3 7 c-4 3 -8 1 -6 -13 z"/>
          <path d="M70 392 h3 v78 h-3 z"/>
          <path d="M71 404 l-16 -12 2 4 14 10 z M71 418 l18 -8 -2 4 -16 7 z M71 432 l-12 8 2 3 10 -8 z M71 400 l10 -16 -2 3 -8 13 z"/>
          <path d="M128 360 h3 v110 h-3 z"/>
          <path d="M129 376 l-20 -14 2 5 18 12 z M129 396 l22 -10 -2 5 -20 9 z M129 416 l-16 10 2 3 14 -10 z M129 368 l14 -18 -3 4 -11 14 z"/>
          <path d="M186 400 h3 v78 h-3 z"/>
          <path d="M187 414 l-14 -10 2 4 12 8 z M187 430 l16 -6 -2 4 -14 5 z M187 406 l8 -14 -2 3 -6 11 z"/>
          <path d="M244 388 h3 v86 h-3 z"/>
          <path d="M245 402 l-16 -12 2 4 14 10 z M245 420 l18 -8 -2 4 -16 7 z M245 396 l12 -16 -2 3 -10 13 z"/>
        </g>
      </svg>
      <p class="caption">Finally a login page that doesn't suck</p>
      <div class="dots"><span class="active"></span><span></span><span></span></div>
    </aside>
  </main>

  <script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("toggle-password");
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    toggle.addEventListener("click", () => {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      toggle.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.textContent = "Signed in as " + document.getElementById("email").value;
    });

    document.querySelectorAll(".social").forEach((button) => {
      button.addEventListener("click", () => {
        message.textContent = button.getAttribute("aria-label");
      });
    });
  </script>
</body>
</html>
